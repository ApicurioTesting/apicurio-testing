apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-test-data
data:
  init-repo.sh: |
    #!/bin/sh
    set -e
    REPO_DIR=/repos/default
    mkdir -p "$REPO_DIR/content"
    cd "$REPO_DIR"
    git init --initial-branch=main
    git config user.email "test@apicurio.io"
    git config user.name "Test Init"
    printf '%s\n' '$type: registry-v0' 'registryId: e2e-test' 'globalRules:' '  - ruleType: VALIDITY' '    config: FULL' 'properties: []' > registry.registry.yaml
    printf '%s\n' '$type: group-v0' 'registryIds: [e2e-test]' 'groupId: foo' > group-foo.registry.yaml
    printf '%s\n' '$type: artifact-v0' 'registryIds: [e2e-test]' 'groupId: foo' 'artifactId: petstore' 'artifactType: OPENAPI' 'versions:' '  - version: "1"' '    state: ENABLED' '    content: ./content/petstore-1.0.0.yaml' 'rules:' '  - ruleType: COMPATIBILITY' '    config: BACKWARD' > artifact-petstore.registry.yaml
    printf '%s\n' 'openapi: "3.0.0"' 'info:' '  version: 1.0.0' '  title: Swagger Petstore' 'paths: {}' > content/petstore-1.0.0.yaml
    git add .
    git commit -m "Initial test data"
    echo "Git repo initialized at $REPO_DIR on branch main"
