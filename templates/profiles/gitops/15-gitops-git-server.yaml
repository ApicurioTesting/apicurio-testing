apiVersion: v1
kind: Pod
metadata:
  name: gitops-git-server
  labels:
    app: gitops-git-server
spec:
  initContainers:
    - name: seed-repo
      image: alpine/git:v2.47.2
      command: ["/bin/sh", "/init-data/init-repo.sh"]
      volumeMounts:
        - name: git-repos
          mountPath: /repos
        - name: init-data
          mountPath: /init-data
  containers:
    - name: git-daemon
      image: alpine/git:v2.47.2
      command: ["/bin/sh", "-c", "apk add --no-cache git-daemon && git daemon --verbose --export-all --enable=receive-pack --base-path=/repos --port=9418 /repos"]
      ports:
        - containerPort: 9418
          name: git
          protocol: TCP
      volumeMounts:
        - name: git-repos
          mountPath: /repos
  volumes:
    - name: git-repos
      emptyDir: {}
    - name: init-data
      configMap:
        name: gitops-test-data
        defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-git-server
  labels:
    app: gitops-git-server
spec:
  ports:
    - name: git
      port: 9418
      targetPort: 9418
      protocol: TCP
  selector:
    app: gitops-git-server
  type: ClusterIP
